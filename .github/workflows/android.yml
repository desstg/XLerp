# Android 安装包自动构建与签名：
# - 推送 v* 标签或手动触发（填 tag 如 v2.14.2）时，在云端 Windows 用正式签名证书打包 xerp-<版本>-android.apk
# - 自动上传为对应 GitHub Release 的附件
name: android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布附件的版本标签（如 v2.14.2，留空只做构建测试）'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 确保 Android SDK 36 与 build-tools 36.1.0 已安装
        shell: powershell
        run: |
          $sdk = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, "$env:LOCALAPPDATA\Android\Sdk") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found' }
          $need = @()
          if (-not (Test-Path "$sdk\platforms\android-36\android.jar")) { $need += 'platforms;android-36' }
          if (-not (Test-Path "$sdk\build-tools\36.1.0\apksigner.bat")) { $need += 'build-tools;36.1.0' }
          if ($need.Count -gt 0) {
            $mgr = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
            "y`ny`ny`ny`ny`ny`n" | & $mgr @need
          }

      - name: 准备签名证书
        shell: powershell
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PROPS_B64: ${{ secrets.ANDROID_KEYSTORE_PROPS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:USERPROFILE '.xerp-android'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Secret 里粘贴的 base64 常带换行 / 空格 / BOM，甚至有 data:...;base64, 前缀，统一清洗后再解码
          function Clean-B64([string]$s) {
            if (-not $s) { return '' }
            $s = $s -replace '^\uFEFF', ''
            $s = $s -replace '^data:[^,]*,', ''
            $s = $s -replace '\s', ''
            return $s
          }
          $ks = Clean-B64 $env:KS_B64
          $pp = Clean-B64 $env:PROPS_B64
          $decoded = $false
          if ($ks -and $pp) {
            try {
              $ksBytes = [Convert]::FromBase64String($ks)
              $ppBytes = [Convert]::FromBase64String($pp)
              # release.jks 至少得是个像样的二进制（几千字节以上）
              if ($ksBytes.Length -lt 1024) { throw "release.jks 只有 $($ksBytes.Length) 字节，不像有效的密钥库" }
              [IO.File]::WriteAllBytes((Join-Path $dir 'release.jks'), $ksBytes)
              [IO.File]::WriteAllBytes((Join-Path $dir 'keystore.properties'), $ppBytes)
              Write-Host "使用仓库 Secrets 里的正式签名证书（jks $($ksBytes.Length) 字节）"
              $propsText = [Text.Encoding]::UTF8.GetString($ppBytes)
              if ($propsText -notmatch 'storePassword' -or $propsText -notmatch 'keyAlias') {
                throw 'keystore.properties 里缺少 storePassword / keyAlias，内容不对'
              }
              $decoded = $true
            } catch {
              Write-Host "::warning::Secrets 不是有效的 base64（$($_.Exception.Message)），本次改用临时证书签名"
            }
          }
          if ($decoded) { exit 0 }
          # 没配 Secrets 或内容无效：生成一次性证书，保证能出包（这样的包不能覆盖安装已装的正式版）
          Write-Host '::warning::未使用正式签名证书，本次用临时证书签名，不能覆盖升级已安装的应用'
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'.ToCharArray()
          $pw = -join (1..24 | ForEach-Object { $chars | Get-Random })
          $ksF = Join-Path $dir 'release.jks'
          $keytool = Join-Path $env:JAVA_HOME 'bin\keytool.exe'
          & $keytool -genkeypair -v -keystore $ksF -alias xerp -keyalg RSA -keysize 2048 -validity 10000 -storepass $pw -keypass $pw -dname 'CN=XLerp,O=XLerp,C=CN'
          if ($LASTEXITCODE -ne 0) { throw 'keytool 生成证书失败' }
          $props = "storeFile=$ksF`nstorePassword=$pw`nkeyAlias=xerp`nkeyPassword=$pw`n"
          [IO.File]::WriteAllText((Join-Path $dir 'keystore.properties'), $props, (New-Object Text.UTF8Encoding $false))

      - name: 打包并签名 Android APK
        shell: powershell
        run: |
          chcp 65001 | Out-Null
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          .\android\build-android.ps1

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: xlerp-android-apk
          path: dist/xlerp-*-android.apk
          if-no-files-found: error

      - name: 上传安装包到 GitHub Release
        if: env.TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $apk = Get-ChildItem dist\xlerp-*-android.apk | Select-Object -First 1
          if (-not $apk) { throw 'Android APK not found' }
          gh release upload "$env:TAG" $apk.FullName --clobber
