# macOS 版自动构建：
# - 推送 v* 标签或手动触发（填 tag 如 v2.22.0）时，在云端 macOS 打包 DMG
# - 自动上传为对应 GitHub Release 的附件
#
# 关于架构：
#   默认构建 arm64（Apple Silicon，2020 年后的 Mac 都是这个）。
#   Intel Mac 用户可以用 Rosetta 2 跑 arm64 版，或者手动触发时把 arch 填 x64。
#   不默认双架构的原因：免费账号的 Actions 并发数很低，两个 macOS 作业同时跑
#   会互相抢占，实测 macos-14 一启动就被 cancelled、macos-13 无限排队。
#
# 不签名：Apple 公证要 $99/年开发者账号。用户首次打开需要
#   右键 →「打开」，或者跑 xattr -dr com.apple.quarantine /Applications/XLerp.app
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布附件的版本标签（如 v2.22.0，留空只做构建测试）'
        required: false
      arch:
        description: '构建架构：arm64（默认，Apple Silicon）或 x64（Intel）'
        required: false
        default: 'arm64'

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  ARCH: ${{ inputs.arch || 'arm64' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 环境信息
        run: |
          echo "架构: $(uname -m)"
          echo "目标: $ARCH"
          echo "版本标签: ${TAG:-（仅构建不发布）}"
          sw_vers

      - name: 构建 DMG
        env:
          TARGET_ARCH: ${{ env.ARCH }}
        run: |
          chmod +x mac/build-mac.sh
          ./mac/build-mac.sh

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: xlerp-macos-${{ env.ARCH }}
          path: |
            dist/XLerp-*-macOS-*.dmg
            dist/XLerp-*-macOS-*.dmg.sha256
          if-no-files-found: error

      - name: 上传 DMG 到 GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMG=$(ls dist/XLerp-*-macOS-*.dmg 2>/dev/null | head -1 || true)
          if [ -z "$DMG" ]; then echo "未找到 DMG" >&2; exit 1; fi
          echo "上传 $DMG → $TAG"
          # Release 不存在时先建一个
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 不存在，跳过上传（请先创建 Release）"
            exit 0
          fi
          gh release upload "$TAG" "$DMG" --clobber
          [ -f "$DMG.sha256" ] && gh release upload "$TAG" "$DMG.sha256" --clobber
          echo "完成"
